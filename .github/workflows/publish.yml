name: Publish to GitHub Packages

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: pypi
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      
      - name: Set Python version
        run: uv python pin 3.13
      
      - name: Install dependencies
        run: uv sync --frozen --group dev
      
      - name: Run tests
        run: uv run pytest -v
      
      - name: Build package
        run: uv build

      - name: Publish to GitHub Packages
        run: |
          uv publish \
            --publish-url https://pypi.pkg.github.com \
            --username __token__ \
            --password ${{ secrets.GITHUB_TOKEN }}
